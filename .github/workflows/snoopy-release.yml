# Snoopy: every push to master builds, tests and signs the release APK and publishes it as a
# GitHub release (tag v<versionName>.<run number>), the one the in-app updater offers
# (AppUpdates.LATEST_URL). Can also be started by hand (Actions → Snoopy release → Run workflow).
#
# Secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_B64     keystore/snoopy-release.jks in base64 (required: every release must be
#                            signed with the same key, or Android refuses to update over it)
#   RELEASE_STORE_PASSWORD   } the RELEASE_* lines of the local .env
#   RELEASE_KEY_ALIAS        }
#   RELEASE_KEY_PASSWORD     }
#   RAWG_API_KEY, THEGAMESDB_API_KEY  optional: game details; without them they show "no data"

name: Snoopy release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snoopy-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNOOPY_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is not set: a release signed with another key could not update Snoopy."
            exit 1
          fi
          mkdir -p keystore
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > keystore/snoopy-release.jks

      - name: Unit tests and release APK
        env:
          RELEASE_STORE_FILE: keystore/snoopy-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$base.$SNOOPY_BUILD" >> "$GITHUB_OUTPUT"

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -qi "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          apk="dist/snoopy-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum "snoopy-$VERSION.apk" > "snoopy-$VERSION.apk.sha256")
          {
            echo "$(git log -1 --format=%s)"
            echo
            echo "Automated build of ${GITHUB_SHA::7}."
          } > notes.md
          gh release create "v$VERSION" dist/* \
            --title "Snoopy $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Remove the keystore
        if: always()
        run: rm -rf keystore
